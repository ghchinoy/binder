name: CI

# Quality gate for every PR and for pushes to main: gofmt + go vet +
# go test (`make check`). The external okf interop gate (`make gate`) is
# intentionally excluded — it needs a network install of okfcli/okf and would
# make the pipeline flaky. Dependencies are fetched from the Go module proxy,
# pinned via go.mod/go.sum and verified against the go.sum hashes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Gate (gofmt + vet + test)
        run: make check

  transcript-version-gate:
    # Pins the version literals inside the plugins/ JSON transcripts to the
    # producing binary (issue #169). This is deliberately SEPARATE from the
    # in-process `make check` gate: it needs a STAMPED binder (the real release
    # tag via ldflags), and a `go test` build is unstamped (binder/dev), so the
    # unit gate structurally cannot check version literals. fetch-depth: 0 is
    # required so `git describe --tags` can resolve the current release tag.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pin transcript version literals to the stamped binary
        run: |
          chmod +x scripts/check-transcript-versions.sh
          ./scripts/check-transcript-versions.sh

      - name: Transcript-version fixtures (vacuous-pass regression lock)
        # Proves the gate fails LOUD when discovery breaks (empty/wrong docroot,
        # renamed fence tag) instead of passing vacuously — the round-2 Critical.
        run: |
          chmod +x scripts/check-transcript-versions-fixtures.sh
          ./scripts/check-transcript-versions-fixtures.sh

  plugin-validate:
    # Validates the okf-convert Agent Plugin/Skill bundle (plugins/,
    # .claude-plugin/) against Agent Plugins 1.0.0. Independent of the Go gate;
    # the packaging artifacts are inert to `go build` / `make check`.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        # The validator parses frontmatter with a real YAML parser (issue #89);
        # setup-python's clean env does not ship PyYAML, so install it explicitly.
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate plugin & skill (Agent Plugins 1.0.0)
        run: |
          chmod +x scripts/validate-plugin.sh
          ./scripts/validate-plugin.sh

      - name: Plugin-validate fixtures (fail-closed regression tests)
        run: |
          chmod +x scripts/validate-plugin-fixtures.sh
          ./scripts/validate-plugin-fixtures.sh

  conformance:
    # Cross-language error-string + trust conformance (issue #171). Binds the Go
    # source of truth (internal/okf/native, internal/okf/trust) to the astro-okf
    # TypeScript codec, the validate-plugin.sh Python copy, and the two testdata
    # prose fixtures. The expected values are derived LIVE from the Go code, so
    # editing a Go error string or actor rule turns this job red once per copy
    # that failed to follow. Needs Go + Node + Python together, so it is its own
    # job rather than folded into the Go-only or Node-only gates.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        # The Python copy under test parses frontmatter with a real YAML parser
        # (issue #89); setup-python's clean env does not ship PyYAML.
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install Node deps
        run: npm ci

      - name: Build astro-okf (tsc -> dist)
        run: npm run build --workspace astro-okf

      - name: Cross-language conformance (#171)
        run: |
          chmod +x scripts/conformance/cross-language-conformance.sh
          ./scripts/conformance/cross-language-conformance.sh

      - name: Negative fixture — the check must go RED on divergence (#171)
        run: |
          chmod +x scripts/conformance/negative-fixture.sh
          ./scripts/conformance/negative-fixture.sh
