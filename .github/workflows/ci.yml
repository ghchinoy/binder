name: CI

# Quality gate for every PR and for pushes to main: gofmt + go vet +
# go test (`make check`). The external okf interop gate (`make gate`) is
# intentionally excluded — it needs a network install of okfcli/okf and would
# make the pipeline flaky. Dependencies are fetched from the Go module proxy,
# pinned via go.mod/go.sum and verified against the go.sum hashes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Gate (gofmt + vet + test)
        run: make check

  transcript-version-gate:
    # Pins version literals to the producing binary across two surfaces, gated
    # in one job because they share one precondition:
    #
    #   - DOCUMENTED TRANSCRIPTS (issue #169) -- the JSON envelopes written down
    #     in plugins/, docs/ and README.md; docs/ and README.md added by #185,
    #     where nine envelopes had silently drifted two minor versions while
    #     nothing watched them.
    #   - SHIPPED OUTPUT (issue #60) -- the text binder itself PRINTS, help and
    #     error prose, checked by EXECUTING the binary rather than reading it.
    #
    # WHEN RESOLVING A MERGE IN THIS FILE, CHECK THAT NO GATE WAS DELETED. The
    # two surfaces arrived on different branches carrying different numbers of
    # steps, so a wholesale resolution toward either side can drop a gate -- and
    # everything then goes green, because the gate that would have objected is
    # the one that was removed. Do NOT check this with a grep count: a loose
    # count scores comments as invocations, a tool- or path-shaped regex scores
    # docs-impact.yml at zero though it holds ./bin/docs-impact-gate, and a
    # plain set dedupes this file's four identical checkouts. Diff the
    # JOB-QUALIFIED, GUARD-KEYED inventory instead -- every uses: and every run:
    # command line, keyed by job and by if/continue-on-error, with both sides of
    # the delta enumerated. `if: false` and an inverted folded guard both
    # neutralise a gate while leaving its command string untouched.
    #
    # SEPARATE from the in-process `make check` gate: both need a STAMPED binder
    # (the real release tag via ldflags), and a `go test` build is unstamped
    # (binder/dev), so the unit gate structurally cannot check version VALUES.
    # fetch-depth: 0 is required so `git describe --tags` resolves the tag.
    #
    # The complementary authoring-time check that `make check` CAN run is
    # internal/version's TestNoHardCodedVersionLiteralInShippedGo, which rejects
    # a hard-coded version in any shipped Go string literal without needing to
    # know what the right version is.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pin transcript version literals to the stamped binary
        run: |
          chmod +x scripts/check-transcript-versions.sh
          ./scripts/check-transcript-versions.sh

      - name: Transcript-version fixtures (vacuous-pass regression lock)
        # Proves the gate fails LOUD when discovery breaks (empty/wrong base,
        # renamed fence tag, missing scan root) instead of passing vacuously —
        # the round-2 Critical, plus the #185 docs/README coverage cases.
        run: |
          chmod +x scripts/check-transcript-versions-fixtures.sh
          ./scripts/check-transcript-versions-fixtures.sh

      # The two steps below are issue #60's half of the same gate: they pin the
      # version literals the BINARY PRINTS (help text, invalid-actor errors)
      # rather than the ones written down in markdown transcripts. They live in
      # this job, not a new one, because they share its exact precondition — a
      # stamped build, hence fetch-depth: 0 — via scripts/lib/stamped-binder.sh.
      # Two overlapping version gates with two checkouts and two builds would be
      # a worse outcome than one job that covers both surfaces.
      - name: Pin shipped help/error version literals to the stamped binary
        run: |
          chmod +x scripts/check-shipped-version-literals.sh
          ./scripts/check-shipped-version-literals.sh

      - name: Shipped-output fixtures (the gate must go RED on a stale literal)
        # Rebuilds binder from patched copies of the tree to prove the gate reds
        # on the #60 defect verbatim, on a v-prefixed producer version, and —
        # the vacuous-pass lock — when a must-reach surface stops emitting an
        # exemplar at all.
        run: |
          chmod +x scripts/check-shipped-version-literals-fixtures.sh
          ./scripts/check-shipped-version-literals-fixtures.sh

  plugin-validate:
    # Validates the okf-convert Agent Plugin/Skill bundle (plugins/,
    # .claude-plugin/) against Agent Plugins 1.0.0. Independent of the Go gate;
    # the packaging artifacts are inert to `go build` / `make check`.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        # The validator parses frontmatter with a real YAML parser (issue #89);
        # setup-python's clean env does not ship PyYAML, so install it explicitly.
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate plugin & skill (Agent Plugins 1.0.0)
        run: |
          chmod +x scripts/validate-plugin.sh
          ./scripts/validate-plugin.sh

      - name: Plugin-validate fixtures (fail-closed regression tests)
        run: |
          chmod +x scripts/validate-plugin-fixtures.sh
          ./scripts/validate-plugin-fixtures.sh

  conformance:
    # Cross-language error-string + trust conformance (issue #171). Binds the Go
    # source of truth (pkg/okf/native, pkg/okf/trust) to the astro-okf
    # TypeScript codec, the validate-plugin.sh Python copy, and the two testdata
    # prose fixtures. The expected values are derived LIVE from the Go code, so
    # editing a Go error string or actor rule turns this job red once per copy
    # that failed to follow. Needs Go + Node + Python together, so it is its own
    # job rather than folded into the Go-only or Node-only gates.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        # The Python copy under test parses frontmatter with a real YAML parser
        # (issue #89); setup-python's clean env does not ship PyYAML.
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Install Node deps
        run: npm ci

      - name: Build astro-okf (tsc -> dist)
        run: npm run build --workspace astro-okf

      - name: Cross-language conformance (#171)
        run: |
          chmod +x scripts/conformance/cross-language-conformance.sh
          ./scripts/conformance/cross-language-conformance.sh

      - name: Negative fixture — the check must go RED on divergence (#171)
        run: |
          chmod +x scripts/conformance/negative-fixture.sh
          ./scripts/conformance/negative-fixture.sh
