name: docs

# Publish-on-main: rebuild and redeploy the docs when main moves, which includes
# the release-please release commit — so a cut still publishes, one commit before
# the tag. The deploy is NOT keyed to a v* tag: the github-pages environment
# rejects tag refs, so a tag-triggered run fails at exactly the moment a release
# is cut. workflow_dispatch allows a manual redeploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# GitHub Pages deployment uses the built-in GITHUB_TOKEN — no PAT/RELEASE_TOKEN
# is needed here; that PAT is a trigger concern only, never a deploy concern.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          # Workspace-rooted: the JS side is one npm workspace (root
          # package.json over packages/* and site/), so there is a single root
          # lockfile and `npm ci` runs at the repo root.
          cache-dependency-path: package-lock.json
      - run: npm ci
      # site/ depends on the in-tree astro-okf via the workspace, and that
      # dependency resolves to packages/astro-okf/dist — so the loader is built
      # before the site is.
      - run: npm run build --workspace astro-okf
      - run: npm run build --workspace binder-site
        # Passed to the build step ONLY, to raise the version-API rate limit.
        # Harmless in Phase 1 (no version.ts yet); the deploy job below does not
        # use it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
