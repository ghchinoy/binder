# binder — goreleaser (v2) release configuration.
#
# Design: /scion-volumes/scratchpad/projects/binder/distribution-design.md §4-§7.
# Invariants preserved vs. a stock config:
#   - Reproducible: -trimpath, -s -w, mod_timestamp={{.CommitTimestamp}}, and the
#     release workflow exports SOURCE_DATE_EPOCH = commit time.
#   - Deps are fetched from the Go module proxy at build time, pinned via
#     go.mod/go.sum and verified against the go.sum hashes (needs network at
#     release time). There is deliberately NO `go mod tidy`/`go mod download`
#     before-hook.
#   - Truthful trust stamp: -X .../cmd.Version={{.Version}} injects the git tag
#     so generated.by = "binder/<tag>" (see cmd/root.go).
#
# Signing (cosign) and SBOMs are intentionally deferred (decision O-4, Phase 4);
# no `signs:`/`sboms:` blocks here. Checksums stay.
version: 2

project_name: binder

before:
  hooks:
    # Compile-sanity check only. NOT `go mod tidy`. Deps are fetched from the
    # module proxy (pinned via go.mod/go.sum).
    - go build -o /dev/null .

builds:
  - id: binder
    main: .                       # binder's main package is at the repo root.
    binary: binder
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"   # reproducible file mtimes.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ghchinoy/binder/cmd.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

brews:
  - name: binder
    directory: Formula
    repository:
      owner: ghchinoy
      name: homebrew-tap           # reuse the existing tap (decision O-1).
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ghchinoy/binder"
    description: "Convert a plain-markdown corpus into a conformant OKF bundle"
    license: "Apache-2.0"
    install: |
      bin.install "binder"
    test: |
      system "#{bin}/binder", "--version"

changelog:
  # release-please owns the human CHANGELOG.md; this only shapes the GitHub
  # Release body. Mirror a2acli's filters.
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: ghchinoy
    name: binder
